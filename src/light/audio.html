<!doctype html>
<html><head><meta charset="utf-8"><title>iJWA</title></head>
<body>
<script type="module">
  import { startMeter } from './audio.js';
  // The one place the PC's sound is listened to: the light windows are sent what it measures.
  startMeter('loopback', (value) => window.ijwa.send('meter', value))
    .then((meter) => window.ijwa.listen('listen', (on) => meter.listen(Boolean(on))))
    .catch((e) => console.error('Audio failed:', e));
</script>
</body></html>
