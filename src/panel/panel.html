<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>iJWA</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="stage">
  <div id="catcher"></div>
  <div id="header"><div class="mosaic"></div><div class="names"><div class="title"><span></span><svg viewBox="0 0 12 12"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="subtitle"></div></div></div>
  <button id="refresh" aria-label="Other songs like this"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4.6h-4.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="play-list" aria-label="Play this playlist"><svg class="play" viewBox="0 0 24 24"><path d="M8 5.6c0-.9 1-1.4 1.7-.9l9.1 5.9c.7.4.7 1.4 0 1.9l-9.1 5.9c-.7.5-1.7 0-1.7-.9z" fill="currentColor"/></svg><svg class="pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.4" height="15" rx="1.3" fill="currentColor"/><rect x="13.6" y="4.5" width="4.4" height="15" rx="1.3" fill="currentColor"/></svg></button>
  <div id="clip"><div id="highlight"></div><div id="list"></div></div>
  <div id="track"><div id="thumb"></div></div>
  <div id="floor"></div>
  <div id="hero">
    <div class="slices"></div>
    <div class="back"></div>
    <div class="pane"><div class="frost"></div><div class="milk"></div></div>
    <div class="face"></div>
    <div class="sheen"></div>
    <div class="inner"></div>
    <div class="sweep"><i></i></div>
    <div class="light"></div>
    <div class="foot"></div>
    <div class="halo"></div>
  </div>
</div>
<script type="module" src="panel.js"></script>
</body>
</html>
